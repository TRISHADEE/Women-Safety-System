<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Women Safety System - Register</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-container">

        <div class="logo">
            🛡️
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your Women Safety account
        </p>

        <form action="register" method="post">

            <label>Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label>Phone Number</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </p>

    </div>

</body>

</html>
